<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06-Specificity</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        /* specificity: 0,0,2 => 2 */
        section button {
            background-color: #ccc;
            border: 2px solid #000;
            border-radius: 0.2rem;
            padding: 0.8rem;
            display: block;
            margin: 2rem auto;
            width: 240px;
        }
        /* specificity: 0,1,2 => 12 */
        section button.green {
            background-color: #59b259;
            color: #fff;
        }
        /* specificity: 0,0,1 => 1 */
        button {
            background-color: #dc143c !important;
        }
    </style>
</head>
<body class="css">

        <section>

        </section>
