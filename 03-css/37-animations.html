<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-Animations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.jungle {
                outline: 4px solid #fff;
                border-radius: 12px;
                corner-shape: squircle;
                background: url(imgs/jungle.png) no-repeat center / contain;
                margin: 1rem auto;
                width: 360px;
                position: relative;
                height: 440px;

                img, div {
                    position: absolute;
                    top: 200px;
                    left: 0;

                    &.logo {
                        top: 34px;
                        left: 24px;
                        animation: 2.8s animLogo infinite ease;
                    }
                    &.dk {
                        top: 170px;
                        left: 110px;
                        width: 140px;
                        animation: 2s animDK infinite ease;
                    }
                    &.move {
                        top: 90px;
                        left: 0px;
                        animation: 2s animAttack infinite ease-out;

                        img.ryno {
                            width: 120px;
                            animation: 0.25s animRyno infinite ease-in;
                            
                        }
                    }
                }
            }
        }
        @keyframes animLogo {
            0%, 100% {
                transform: scale(.8);
            }
            50% {
                transform: scale(1.12);
            }
        }

        @keyframes animDK {
            0%   { transform: scale(1)   rotateX(0deg);   top: 170px}
            48%  { transform: scale(.75) rotateX(0deg);   top: 70px}
            52%  { transform: scale(.75) rotateX(180deg); top: 70px}
            56%  { transform: scale(.75) rotateX(0deg);   top: 70px}
            70%  { transform: scale(1)   rotateX(0deg);   top: 170px}
            100% { transform: scale(1)   rotateX(0deg);   top: 170px}
        }

        @keyframes animRyno {
            0%, 100% { transform: translateY(0);     }
            50%      { transform: translateY(-12px); }
        }

        @keyframes animAttack {
            0%  { transform: rotateY(0deg); top: 90px; left: 80px;}
            15%  { transform: rotateY(0deg); top: 90px; left: 120px;}
            25%  { transform: rotateY(0deg); top: 50px; left: 120px;}
            30%  { transform: rotateY(0deg); top: 90px; left: 180px;}
            50% { transform: rotateY(0deg); top: 90px; left: 290px;}
            60% { transform: rotateY(180deg); top: 90px; left: 250px;}
            70% { transform: rotateY(180deg); top: 50px; left: 250px;}
            80% { transform: rotateY(180deg); top: 90px; left: 250px;}
            90% { transform: rotateY(180deg); top: 90px; left: 250px;}
            100% { transform: rotateY(0deg); top: 90px; left: 80px;}

        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>37-Animations</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Lets an element gradually change from one style to another.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <div class="jungle">
                <img src="imgs/logo-dk.png" class="logo">
                <img src="imgs/dk.png" class="dk">
                <div class="move">
                    <img src="imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
