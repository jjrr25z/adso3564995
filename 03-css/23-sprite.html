<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Sprite</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div#runner {
                background: url(imgs/run-sprite.png) no-repeat;
                border: 2px solid red;
                height: 256px;
                margin: 2rem auto;
                width: 256px;
                &.sp1{background-position: calc(-256 * 0) 0; }
                &.sp2{background-position: calc(-256 * 1) 0; }
                &.sp3{background-position: calc(-256 * 2) 0; }
                &.sp4{background-position: calc(-256 * 3) 0; }
                &.sp5{background-position: calc(-256 * 4) 0; }
                &.sp6{background-position: calc(-256 * 5) 0; }



            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>23-Sprite</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>An image sprite is a collection of images put into a single image.</h3>
        </header>
        <section>
        <h3 class="subtitle">Runner:</h3>
            <div id="runner" class="sp1"></div>
            <h3 class="subtitle">Dino:</h3>
            <div id="dino" class="sp2"></div>
        </section>
    </main>
    <script>
        const runner= document.getElementById("runner");
        const runnersPrites = 6;
        let countRunner = 1;

        setInterval(() => {
            if(countRunner == runnerSprites) {
                runner.className = '';
                countRunner = 1;
            } else{
                runner.className = '';
                runner.classList.add('sp' + ++countRunner);
            }
        }, 80);
    </script>
</body>
</html>
